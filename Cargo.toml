[package]
name = "celestia-spider"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A concurrent browser-aware web crawler with standard, headless, hybrid, and WASM-compatible engines."
license = "MIT"
repository = "https://github.com/dev-celestia/browser-crawler"
homepage = "https://github.com/dev-celestia/browser-crawler"
documentation = "https://docs.rs/celestia-spider"
readme = "README.md"
keywords = ["crawler", "scraper", "web", "wasm", "async"]
categories = ["web-programming", "web-programming::http-client"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "celestia-spider"
path = "src/bin/celestia-spider.rs"

[dependencies]
scraper = "0.22"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1"
async-trait = "0.1"
regex = "1"
psl = "2"
md-5 = "0.10"
percent-encoding = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["default-tls", "json", "cookies"] }
headless_chrome = "1.0"
clap = { version = "4.5", features = ["derive", "string"] }
serde_yaml = "0.9"
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
