[package]
name = "browser-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["default-tls"] }
scraper = "0.22"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1"
async-trait = "0.1"
headless_chrome = "1.0"
